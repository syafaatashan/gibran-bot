name: gibran-bot
description: Gibran.ai - MCode penuh di container Linux + bridge Telegram dengan rotasi akun otomatis
billing:
  deploymentPlan: nf-compute-20
vcsData:
  projectUrl: https://github.com/syafaatashan/gibran-bot
  projectType: github
  projectBranch: master
buildSettings:
  dockerfile:
    buildEngine: buildkit
    dockerFilePath: /Dockerfile
    dockerWorkDir: /
  storage:
    ephemeralStorage:
      storageSize: 16384
deployment:
  instances: 1
  storage:
    ephemeralStorage:
      storageSize: 2048
ports:
- name: http
  internalPort: 8080
  public: true
  protocol: HTTP
runtimeEnvironment:
  NODE_ENV: production
  PORT: '8080'
  BOT_MODE: runtime-local
  MINIMAX_DATA_DIR: /data
  BOT_WORKSPACE_DIR: /workspace
  TELEGRAM_WEBHOOK_PATH: /tg/webhook
  PUBLIC_BASE_URL: https://http--gibran-bot--t2lhy99dxnfp.code.run
  MCODE_PERMISSION: smart
  MCODE_MAX_STEPS: '24'
  MCODE_TIMEOUT: 15m
  MCODE_EFFORT: high
  MINIMAX_TIMEZONE: Asia/Makassar
