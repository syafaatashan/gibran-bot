logLevel: info
provider:
  minimax:
    name: MiniMax
    npm: '@ai-sdk/anthropic'
    options:
      apiKey: sk-xxx
      baseURL: https://agent.minimax.io/mavis/api/v1/llm/v1
    models:
      MiniMax-M3:
        name: M3
        attachment: true
        reasoning: true
        tool_call: true
        temperature: true
        modalities:
          input:
          - text
          - image
          - video
          output:
          - text
        limit:
          context: 512000
          output: 128000
        contextWindowOptions:
        - 512000
        - 1000000
        contextWindowOptionHints:
          '1000000': higher_usage
        options:
          reasoningSummary: auto
        thinking_config:
          mode: switchable
          default_value: 'true'
        variants:
          none-thinking:
            thinking:
              type: disabled
          thinking:
            thinking:
              type: adaptive
        capabilities:
          support_files_api: true
          files_api_upload_endpoint: /v1/files/upload
          max_image_bytes_inline: 10485760
          max_video_bytes_inline: 52428800
          max_request_body_bytes: 67108864
          max_attachments_count: 9
      MiniMax-M3.1-Flash:
        name: M3.1-Flash
        attachment: true
        reasoning: true
        tool_call: true
        temperature: true
        modalities:
          input:
          - text
          - image
          - video
          output:
          - text
        limit:
          context: 512000
          output: 128000
        contextWindowOptions:
        - 512000
        - 1000000
        contextWindowOptionHints:
          '1000000': higher_usage
        options:
          reasoningSummary: auto
        thinking:
          effortOptions:
          - default
          - low
          - medium
          - high
          - xhigh
          - max
          defaultEffort: default
        thinking_config:
          mode: forced_on
        variants:
          none-thinking:
            thinking:
              type: disabled
          thinking:
            thinking:
              type: adaptive
        capabilities:
          support_files_api: true
          files_api_upload_endpoint: /v1/files/upload
          max_image_bytes_inline: 10485760
          max_video_bytes_inline: 52428800
          max_request_body_bytes: 67108864
          max_attachments_count: 4
    model_order:
    - MiniMax-M3.1-Flash
    - MiniMax-M3
    whitelist:
    - MiniMax-M3
    - MiniMax-M3.1-Flash
minimaxModelSource: token_plan
defaultModel: minimax/MiniMax-M3.1-Flash
dataContribution:
  enabled: false
memory:
  enabled: true
  proactive: true
skipWindowsHardSafetyChecks: false
skipParentDeathGuard: false
permissionMode: bypassPermissions
beta:
  ptc: true
subagent:
  maxConcurrentPerSession: 12
permission:
  nativeDelete: false
defaultModelVariant: thinking
defaultModelThinking:
  effort: max
